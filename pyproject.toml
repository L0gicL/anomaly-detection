[project]
name = "anomaly-detection"
version = "0.1.0"
description = "Visual anomaly detection on the MVTec AD transistor category using Anomalib"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anomalib[cu130]>=2.7.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "openvino>=2024.0",
    "onnx",
    "tensorboard",
    "matplotlib",
    "pandas",
    "pyyaml",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "ruff",
    "pytest",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchcodec = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py312"
